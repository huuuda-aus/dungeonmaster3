<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Crawler</title>
<style>
  :root { --bg:#0b0a0c; --panel:#17141a; --edge:#3a3340; --text:#d9d0c4; --dim:#8a8090;
          --hp:#b3322e; --st:#c9a227; --mp:#3a6fc4; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
               font:14px/1.4 ui-monospace, Menlo, Consolas, monospace; }
  #app { display:grid; grid-template-columns: 1fr 370px; height:100%; }
  #side { display:flex; flex-direction:column; min-height:0; overflow-y:auto;
          background:var(--panel); border-left:1px solid var(--edge); }
  #view { position:relative; min-height:0; }
  #view canvas { display:block; width:100%; height:100%; }
  #feet { position:absolute; left:50%; bottom:64px; transform:translateX(-50%); display:flex; gap:6px; z-index:5; }
  #feet button { width:44px; height:44px; padding:5px; background:rgba(20,17,24,.8); color:#e8d9a8;
                 border:1px solid #7a6a90; border-radius:6px; cursor:pointer; }
  #feet button:hover { background:rgba(70,56,90,.9); }
  #feet svg { width:100%; height:100%; display:block; }
  #log { position:absolute; left:12px; bottom:10px; right:12px; pointer-events:none;
         text-shadow:0 1px 2px #000; font-size:13px; }
  #log div { opacity:.95; }
  #hud { display:flex; flex-direction:column; gap:8px; padding:8px; }
  .champ { border:1px solid var(--edge); border-radius:6px; padding:8px; cursor:pointer;
           user-select:none; background:#1d1921; }
  .champ.dead { opacity:.35; }
  .champ.busy { border-color:#5b4f66; }
  .champ { display:flex; gap:8px; }
  .champ .info { flex:1; min-width:0; }
  .champ h3 { margin:0 0 4px; font-size:14px; cursor:pointer; }
  .vbars { cursor:pointer; }
  .skills { display:grid; grid-template-columns:1fr 1fr; gap:0 8px; font-size:12px; color:var(--dim); }
  .vbars { display:flex; gap:5px; align-items:stretch; order:-1; }
  .vbar { position:relative; width:14px; min-height:92px; background:#0e0c10; border-radius:3px;
          overflow:hidden; border:1px solid #2a2530; }
  .vbar i { position:absolute; left:0; right:0; bottom:0; display:block; transition:height .15s; }
  .vbar.hp i { background:var(--hp); } .vbar.st i { background:var(--st); } .vbar.mp i { background:var(--mp); }
  .meta { color:var(--dim); font-size:12px; margin-top:4px; }
  #spell { display:flex; flex-direction:column; gap:6px; padding:8px; margin-top:auto;
           background:#120f15; border-top:1px solid var(--edge); }
  #spell .grp { display:flex; flex-wrap:nowrap; gap:3px; align-items:center; }
  #spell .grp b { color:var(--dim); font-weight:normal; font-size:11px; width:56px; }
  #spell button { background:#241f29; color:var(--text); border:1px solid var(--edge);
                  border-radius:4px; padding:3px 7px; font:inherit; font-size:12px; cursor:pointer; }
  #spell button:hover { background:#322b39; }
  #spell button.on { background:#4a3d5a; border-color:#8a7aa0; }
  #spell .actions { align-items:stretch; gap:6px; }
  #spell button.cast { flex:1; padding:9px 0; font-size:15px; font-weight:bold; letter-spacing:.08em;
                       text-transform:uppercase; background:#5b3a8c; border-color:#a78bd6; color:#fff; }
  #spell button.cast:hover { background:#7048ab; }
  #spell button.cast.cooling { background:linear-gradient(90deg, #5b3a8c calc(var(--p, 0) * 100%), #2a2233 0); color:#cbbfe0; border-color:#6a5a7e; text-transform:none; letter-spacing:.02em; }
  #spell button.cast:disabled { background:#2a2233; border-color:var(--edge); }
  #spell button.recant { padding:0 10px; font-size:11px; color:var(--dim); }
  #spell .seq { color:#c9b8e0; min-height:2.6em; font-size:12px; }
  #spell .caster { color:var(--dim); font-size:12px; }
  #spell .chosen { display:flex; gap:4px; align-items:center; min-height:26px; flex-wrap:wrap; }
  #spell .chosen span { background:#4a3d5a; border:1px solid #8a7aa0; border-radius:4px; padding:2px 7px; font-size:12px; }
  #spell .chosen span.hint { background:none; border:0; color:var(--dim); padding:0; }
  #spell .chosen em { color:var(--dim); font-style:normal; }
  #spell button:disabled { cursor:default; opacity:.4; }
  #spell button sup { font-size:9px; color:#9b8cb0; margin-left:2px; }
  .champ.sel { border-color:#9a86c8; box-shadow:0 0 0 1px #9a86c8 inset; }
  #spell .seq.ok { color:#9be08a; } #spell .seq.bad { color:#e08a8a; }
  #inv { --s: clamp(58px, 10vh, 96px); position:absolute; inset:12px; z-index:10; display:flex; flex-direction:column;
         background:rgba(18,15,22,.97); border:1px solid #7a6a90; border-radius:10px; padding:16px 18px;
         box-shadow:0 12px 48px rgba(0,0,0,.75); font-size:16px; line-height:1.35; overflow:auto; }
  #inv .invhead { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex:none; }
  #inv .tabs { display:flex; gap:8px; }
  #inv .tabs button, #inv .x { background:#2a2332; color:var(--text); border:1px solid var(--edge); border-radius:6px;
                               padding:8px 18px; font:inherit; font-size:17px; cursor:pointer; }
  #inv .tabs button.on { background:#46385a; border-color:#a78bd6; color:#fff; }
  #inv .tabs button.dead { opacity:.45; }
  #inv .invbody { display:grid; grid-template-columns: minmax(250px, 1fr) minmax(0, 2fr) minmax(190px, 0.8fr); gap:22px; flex:1; min-height:0; }
  #inv h4 { margin:0 0 10px; font-size:24px; }
  #inv .kv { display:flex; justify-content:space-between; gap:12px; padding:2px 0; color:var(--dim); }
  #inv .kv b { color:var(--text); font-weight:normal; }
  #inv hr { border:0; border-top:1px solid var(--edge); margin:12px 0; }
  #inv .sk { margin-bottom:10px; }
  #inv .sk b { display:block; font-size:17px; margin-bottom:2px; }
  #inv .sk div { display:grid; grid-template-columns:1fr 1fr; gap:0 14px; color:var(--dim); font-size:15px; }
  #inv .sk div span em { font-style:normal; color:var(--text); float:right; }
  #inv .mini { flex:1; height:10px; background:#0e0c10; border-radius:5px; align-self:center; overflow:hidden; }
  #inv .mini i { display:block; height:100%; background:#8fb04a; }
  #inv .label { color:#b9aecb; font-size:15px; margin:16px 0 6px; text-transform:uppercase; letter-spacing:.06em; }
  #inv .dollgrid { display:grid; grid-template-columns:repeat(3, var(--s)); grid-template-areas:
       "neck head ." "lh torso rh" ". legs mouth" ". feet ."; gap:10px; justify-content:center; }
  #inv .row.small { display:flex; gap:10px; flex-wrap:wrap; }
  #inv .pack { display:grid; grid-template-columns:repeat(6, calc(var(--s) * .9)); gap:10px; }
  #inv .slot { position:relative; width:var(--s); height:var(--s); padding:calc(var(--s) * .12); background:#17141a; color:var(--text);
               border:2px solid #3a3340; border-radius:8px; cursor:pointer; }
  #inv .slot.sm, #inv .pack .slot { width:calc(var(--s) * .9); height:calc(var(--s) * .9); }
  #inv .slot:hover { border-color:#a78bd6; background:#241f29; }
  #inv .slot.filled { background:#262030; border-color:#6a5a7e; }
  #inv .slot.ghost { opacity:.4; }
  #inv .slot.mouth.ready { border-color:#7bc47a; box-shadow:0 0 12px #4a8a4a; }
  #inv .slot svg { display:block; width:100%; height:100%; }
  #inv .slot .empty { display:flex; align-items:center; justify-content:center; height:100%; font-size:13px; color:#8a809a; text-align:center; line-height:1.15; }
  #inv .ground .floorlist { display:flex; flex-wrap:wrap; gap:10px; }
  #inv .ground .none { color:var(--dim); }
  #inv .drop { background:#3a2c4a; color:var(--text); border:1px solid #7a6a90; border-radius:6px; padding:12px; font:inherit; font-size:16px; cursor:pointer; width:100%; }
  #cursoritem { position:fixed; z-index:50; width:56px; height:56px; color:#fff; pointer-events:none;
                filter:drop-shadow(0 2px 6px #000); }
  #cursoritem svg { width:100%; height:100%; }
  .champ.droptarget { border-color:#7bc47a; box-shadow:0 0 10px #3a7a3a; cursor:copy; }
  .actmenu .sep { border-top:1px solid var(--edge); margin:3px 0; }
  @media (max-width:1100px) { #inv .invbody { grid-template-columns:1fr; } }
  .hands { display:flex; gap:8px; margin-top:8px; }
  .hand { position:relative; width:88px; height:88px; padding:10px; background:#1a161e; color:var(--text);
          border:1px solid var(--edge); border-radius:6px; cursor:pointer; overflow:hidden; }
  .hand:hover:not(:disabled) { background:#2a2332; border-color:#7a6a90; }
  .hand[data-hand="1"] { order:-1; } /* weapon (action) hand on the left, shield (ready) hand on the right */
  .hand.twohand[data-hand="1"] { border-color:#8a7aa0; }
  .hand.twohand[data-hand="0"] { opacity:.45; }
  .hand .ico { display:block; width:100%; height:100%; }
  .hand .cd { position:absolute; left:0; right:0; bottom:0; height:0; background:rgba(0,0,0,.6); transition:height .12s linear; pointer-events:none; }
  .actmenu { position:fixed; z-index:20; min-width:200px; background:#1d1921; border:1px solid #7a6a90;
             border-radius:6px; padding:6px; box-shadow:0 6px 24px rgba(0,0,0,.6); display:flex; flex-direction:column; gap:4px; }
  .actmenu .title { color:var(--dim); font-size:11px; padding:0 4px 3px; }
  .actmenu .none { color:var(--dim); padding:4px; font-size:12px; }
  .actmenu button { display:flex; justify-content:space-between; align-items:baseline; gap:12px; background:#2a2332;
                    color:var(--text); border:1px solid var(--edge); border-radius:4px; padding:6px 8px; font:inherit; cursor:pointer; }
  .actmenu button:hover:not(:disabled) { background:#46385a; border-color:#a78bd6; }
  .actmenu button:disabled { opacity:.45; cursor:default; }
  .actmenu small { color:var(--dim); font-size:11px; }
  .champ .acts { display:flex; gap:4px; margin-top:6px; }
  .champ .acts button { flex:1; background:#241f29; color:var(--text); border:1px solid var(--edge);
                        border-radius:4px; padding:2px 0; font:inherit; font-size:12px; cursor:pointer; }
  .champ .acts button:hover { background:#322b39; }
  #gear { position:absolute; top:8px; right:10px; z-index:12; background:rgba(20,17,24,.7); color:var(--text);
          border:1px solid var(--edge); border-radius:6px; width:34px; height:34px; font-size:18px; cursor:pointer; }
  #gear:hover { border-color:#a78bd6; }
  #settings { position:absolute; top:48px; right:10px; z-index:12; width:260px; background:rgba(20,17,24,.96);
              border:1px solid #7a6a90; border-radius:8px; padding:10px 12px; font-size:14px; }
  #settings h5 { margin:0 0 8px; font-size:15px; }
  #settings label { display:flex; gap:8px; align-items:flex-start; cursor:pointer; }
  #settings label.sel { display:block; margin-top:10px; }
  #settings select { display:block; width:100%; margin-top:4px; background:#2a2332; color:var(--text); border:1px solid var(--edge); border-radius:4px; padding:5px; font:inherit; }
  #settings p { margin:8px 0 0; color:var(--dim); font-size:12px; }
  #pause { position:absolute; left:0; right:0; top:42%; z-index:9; place-items:center; pointer-events:none;
           font-size:26px; letter-spacing:.1em; color:#e8d9a8; text-shadow:0 2px 8px #000; }
  #help { position:absolute; top:8px; left:12px; color:var(--dim); font-size:12px;
          text-shadow:0 1px 2px #000; }
  #over { position:absolute; inset:0; display:none; place-items:center; font-size:28px;
          background:rgba(0,0,0,.6); }
  @media (max-width:760px) {
    #app { grid-template-columns: 1fr; grid-template-rows: 55% 1fr; }
    #side { border-left:0; border-top:1px solid var(--edge); }
    #hud { display:grid; grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <div id="help">W/S move · A/D strafe · Q/E turn · P pause · I inventory · 1-4 quick attack · Shift+1-4 pick caster · Z X C V B N runes · Enter cast · Bksp recant</div>
    <div id="log"></div>
    <button id="gear" title="Settings">⚙</button>
    <div id="settings" style="display:none">
      <h5>Settings</h5>
      <label><input type="checkbox" id="opt-pause-inv"> Pause while the inventory is open</label>
      <label class="sel">Dungeon look <select id="opt-theme"></select></label>
      <p>Press P to pause at any time.</p>
    </div>
    <div id="pause" style="display:none">PAUSED</div>
    <div id="over">The party has fallen. Press R to restart.</div>
  </div>
  <div id="side">
    <div id="hud"></div>
    <div id="spell"></div>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
